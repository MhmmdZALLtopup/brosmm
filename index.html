<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BroJJ Panel - Final Fix</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap');
        :root { --bg: #09090b; --card: rgba(24, 24, 27, 0.7); --primary: #4f46e5; --text: #fafafa; --muted: #a1a1aa; --success: #10b981; --glass-border: rgba(255, 255, 255, 0.08); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); overflow-x: hidden; background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg) 50%); background-attachment: fixed; }

        /* Overlays */
        .fullscreen-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(9, 9, 11, 0.98); backdrop-filter: blur(10px); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        #maintenanceScreen, #mainApp, #supportModal, #loginScreen { display: none; }
        
        .loader { border: 4px solid rgba(255,255,255,0.1); border-left-color: var(--primary); border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        .login-box { background: var(--card); padding: 35px 25px; border-radius: 25px; border: 1px solid var(--primary); width: 90%; max-width: 350px; box-shadow: 0 10px 40px rgba(79, 70, 229, 0.4); }
        .btn-google { background: white; color: black; padding: 15px; border-radius: 15px; width: 100%; font-weight: 700; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 25px; font-size: 1rem; transition: 0.2s; }
        .btn-google:active { transform: scale(0.95); }

        /* General UI */
        .app-container { max-width: 500px; margin: 0 auto; min-height: 100vh; padding-bottom: 110px; }
        header { padding: 25px 20px; display: flex; justify-content: space-between; align-items: center; }
        .balance-box { background: rgba(79, 70, 229, 0.15); padding: 10px 18px; border-radius: 15px; border: 1px solid var(--primary); backdrop-filter: blur(5px); text-align: right; }
        .bottom-nav { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 450px; background: var(--card); backdrop-filter: blur(20px); display: flex; justify-content: space-around; padding: 15px; border-radius: 20px; border: 1px solid var(--glass-border); z-index: 100; }
        .nav-item { color: var(--muted); text-align: center; cursor: pointer; font-size: 0.7rem; width: 20%; }
        .nav-item i { font-size: 1.3rem; display: block; margin-bottom: 5px; }
        .nav-item.active { color: var(--primary); }
        
        .section { display: none; padding: 0 20px; animation: fadeIn 0.4s ease-out; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }

        .card { background: var(--card); padding: 20px; border-radius: 20px; margin-bottom: 20px; border: 1px solid var(--glass-border); }
        .btn-main { width: 100%; background: linear-gradient(135deg, #6366f1, #4f46e5); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: 600; margin-top: 15px; cursor: pointer; }
        input, select { width: 100%; background: rgba(0,0,0,0.5); border: 1px solid var(--glass-border); padding: 14px; border-radius: 12px; color: white; margin-top: 8px; outline: none; }

        .chat-box { flex-grow: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 12px; height: 45vh; }
        .msg { max-width: 85%; padding: 10px 14px; border-radius: 15px; font-size: 0.85rem; }
        .msg-me { align-self: flex-end; background: var(--primary); }
        .msg-them { align-self: flex-start; background: rgba(255,255,255,0.07); }
    </style>
</head>
<body>

    <div id="loadingOverlay" class="fullscreen-overlay">
        <div class="loader"></div>
        <h3 id="loadingText">Sistem Memuat...</h3>
    </div>

    <div id="loginScreen" class="fullscreen-overlay">
        <div class="login-box animate__animated animate__zoomIn">
            <i class="fa-solid fa-bolt" style="font-size: 3.5rem; color: var(--primary); margin-bottom: 10px;"></i>
            <h1 style="font-size: 1.5rem;">BroJJ Panel</h1>
            <p style="color: var(--muted); font-size: 0.85rem;">Silakan login untuk memesan</p>
            <button class="btn-google" id="tombolLoginGmail">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" width="22">
                Lanjutkan ke Gmail
            </button>
        </div>
    </div>

    <div id="mainApp" class="app-container">
        <header>
            <div>
                <div style="font-weight: 800; font-size: 1.4rem;">BroJJ</div>
                <div id="userName" style="font-size: 0.7rem; color: var(--muted);">User</div>
            </div>
            <div class="balance-box">
                <span id="userBalance" style="font-weight: 800;">Rp 0</span>
            </div>
        </header>

        <div id="home" class="section active">
            <div class="card">
                <h3>Layanan SMM</h3>
                <p style="color:var(--muted); font-size: 0.8rem; margin-bottom: 15px;">Pilih kategori di bawah</p>
                <button class="btn-main" onclick="openOrder('IG Followers', 15000, 100)">IG Followers - Rp 15k</button>
                <button class="btn-main" onclick="openOrder('TikTok Views', 1000, 1000)">TikTok Views - Rp 1k</button>
            </div>
        </div>

        <div id="account" class="section">
            <div class="card" style="text-align: center;">
                <img id="profilePic" src="" style="width: 70px; border-radius: 50%; margin-bottom: 10px; border: 2px solid var(--primary); display:none;">
                <h3 id="profileName">Nama User</h3>
                <button class="btn-main btn-danger" onclick="logout()" style="background: #ef4444; margin-top: 20px;">Keluar Akun</button>
            </div>
        </div>

        <nav class="bottom-nav">
            <div class="nav-item active" onclick="showSection('home', this)"><i class="fa-solid fa-house"></i>Home</div>
            <div class="nav-item" onclick="showSection('account', this)"><i class="fa-solid fa-user"></i>Akun</div>
        </nav>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithRedirect, getRedirectResult, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, get, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // CONFIG (PENTING: authDomain wajib diisi)
        const firebaseConfig = { 
            apiKey: "AIzaSyD3usv5rw801fV1nrXIwyDQ6eYEzC7hDk0", 
            authDomain: "kodangz.firebaseapp.com", 
            projectId: "kodangz", 
            databaseURL: "https://kodangz-default-rtdb.firebaseio.com" 
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });

        const loadingOverlay = document.getElementById('loadingOverlay');
        const loginScreen = document.getElementById('loginScreen');
        const mainApp = document.getElementById('mainApp');

        console.log("Script Firebase Berhasil Dimuat");

        // 1. CEK HASIL REDIRECT (SETELAH USER PILIH GMAIL)
        getRedirectResult(auth).then((result) => {
            if (result?.user) {
                console.log("User berhasil masuk via redirect:", result.user.displayName);
            }
        }).catch((err) => {
            console.error("Error Redirect:", err);
            loadingOverlay.style.display = 'none';
        });

        // 2. PANTAU STATUS LOGIN
        onAuthStateChanged(auth, async (user) => {
            loadingOverlay.style.display = 'none';
            if (user) {
                console.log("Status: Logged In", user.uid);
                loginScreen.style.display = 'none';
                mainApp.style.display = 'block';
                
                document.getElementById('userName').innerText = user.displayName;
                document.getElementById('profileName').innerText = user.displayName;
                if(user.photoURL) { 
                    document.getElementById('profilePic').src = user.photoURL; 
                    document.getElementById('profilePic').style.display = 'inline-block'; 
                }

                // Ambil Saldo
                const userRef = ref(db, `users/${user.uid}`);
                const snap = await get(userRef);
                if(!snap.exists()) {
                    await set(userRef, { name: user.displayName, email: user.email, balance: 0 });
                }
                onValue(ref(db, `users/${user.uid}/balance`), (s) => {
                    document.getElementById('userBalance').innerText = 'Rp ' + (s.val() || 0).toLocaleString();
                });

            } else {
                console.log("Status: Not Logged In");
                loginScreen.style.display = 'flex';
                mainApp.style.display = 'none';
            }
        });

        // 3. FUNGSI KLIK LOGIN (DITEMPEL KE TOMBOL)
        const loginBtn = document.getElementById('tombolLoginGmail');
        if(loginBtn) {
            loginBtn.addEventListener('click', () => {
                console.log("Tombol Gmail Dipencet!");
                loadingOverlay.style.display = 'flex';
                document.getElementById('loadingText').innerText = "Membuka Google...";
                
                signInWithRedirect(auth, provider).catch(err => {
                    alert("Error: " + err.message);
                    loadingOverlay.style.display = 'none';
                });
            });
        } else {
            console.error("Tombol login tidak ditemukan di HTML!");
        }

        // FUNGSI LAINNYA
        window.logout = () => { signOut(auth).then(() => window.location.reload()); };
        
        window.showSection = (id, el) => {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
        };

        window.openOrder = (service, price, min) => {
            Swal.fire({
                title: 'Pesan ' + service,
                input: 'number',
                inputLabel: 'Masukkan Jumlah (Minimal ' + min + ')',
                background: '#18181b', color: '#fff',
                showCancelButton: true
            }).then(async (res) => {
                if(res.isConfirmed) {
                    Swal.fire('Sukses', 'Pesanan sedang diproses admin', 'success');
                }
            });
        };

    </script>
</body>
</html>
