<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BroJJ Elite Panel - Secure Access</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

        :root {
            --bg: #050505;
            --card: #0f0f12;
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --accent: #10b981;
            --danger: #ef4444;
            --text: #ffffff;
            --text-dim: #94a3b8;
            --border: rgba(255, 255, 255, 0.06);
            --glass: rgba(15, 15, 18, 0.8);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg); 
            color: var(--text); 
            overflow-x: hidden; 
            padding-bottom: 90px;
            user-select: none;
        }

        /* --- ANIMATED BACKGROUND --- */
        .bg-animate {
            position: fixed; inset: 0; z-index: -1;
            background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #050505 100%);
            overflow: hidden;
        }
        .bg-animate span {
            position: absolute; display: block; width: 20px; height: 20px;
            background: var(--primary-glow); border-radius: 50%;
            animation: move 25s infinite linear; opacity: 0.3;
        }
        @keyframes move {
            from { transform: translateY(100vh) translateX(-10vw); }
            to { transform: translateY(-10vh) translateX(110vw); }
        }

        /* --- LOADING SCREEN --- */
        #loader {
            position: fixed; inset: 0; background: var(--bg); z-index: 10000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .spinner { width: 50px; height: 50px; border: 4px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s infinite linear; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- AUTH OVERLAY --- */
        #authOverlay { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: none; align-items: center; justify-content: center; backdrop-filter: blur(15px); }
        .login-card { background: var(--card); padding: 40px 30px; border-radius: 32px; border: 1px solid var(--border); text-align: center; width: 90%; max-width: 400px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }

        /* --- HEADER & NAVIGATION --- */
        header { 
            padding: 20px; display: flex; justify-content: space-between; align-items: center; 
            position: sticky; top: 0; background: var(--glass); backdrop-filter: blur(15px); z-index: 100; border-bottom: 1px solid var(--border);
        }
        .user-info { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .user-info img { width: 38px; height: 38px; border-radius: 12px; border: 1.5px solid var(--primary); }

        .navbar { 
            position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 450px;
            background: var(--glass); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 24px;
            display: flex; justify-content: space-around; padding: 12px; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .nav-item { color: var(--text-dim); text-align: center; transition: 0.3s; font-size: 0.65rem; font-weight: 700; cursor: pointer; }
        .nav-item.active { color: var(--primary); }
        .nav-item i { display: block; font-size: 1.3rem; margin-bottom: 4px; }

        /* --- CONTENT UI --- */
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .card-main { background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 25px; margin-bottom: 20px; }
        
        .wallet-banner {
            background: linear-gradient(135deg, #6366f1, #8b5cf6); padding: 25px; border-radius: 24px;
            margin-bottom: 25px; position: relative; overflow: hidden; box-shadow: 0 15px 30px var(--primary-glow);
        }
        .wallet-banner h1 { font-size: 2.2rem; font-weight: 800; margin-top: 5px; }

        .chip { background: rgba(0,0,0,0.2); padding: 5px 12px; border-radius: 8px; font-size: 0.7rem; display: inline-flex; align-items: center; gap: 6px; }

        /* --- INPUTS & BUTTONS --- */
        .group { margin-bottom: 15px; }
        .group label { display: block; font-size: 0.75rem; color: var(--text-dim); margin-bottom: 8px; font-weight: 600; }
        input, select { width: 100%; background: #000; border: 1px solid var(--border); padding: 14px; border-radius: 14px; color: #fff; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }

        .btn-p { background: var(--primary); color: #fff; border: none; padding: 16px; border-radius: 14px; font-weight: 800; width: 100%; cursor: pointer; transition: 0.3s; }
        .btn-p:active { transform: scale(0.96); }

        /* --- LISTS --- */
        .list-item { background: var(--card); border: 1px solid var(--border); padding: 16px; border-radius: 18px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .badge { padding: 4px 10px; border-radius: 6px; font-size: 0.65rem; font-weight: 800; text-transform: uppercase; }
        .badge.pending { background: rgba(245, 158, 11, 0.1); color: #f59e0b; }
        .badge.acc { background: rgba(16, 185, 129, 0.1); color: #10b981; }
        .badge.tolak { background: rgba(239, 68, 68, 0.1); color: #ef4444; }

        .tab-view { display: none; animation: slideUp 0.4s ease-out; }
        .tab-view.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* --- CHATBOX --- */
        #chatBox { height: 350px; overflow-y: auto; background: #000; border-radius: 18px; padding: 15px; display: flex; flex-direction: column; gap: 12px; border: 1px solid var(--border); }
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 15px; font-size: 0.85rem; line-height: 1.4; }
        .msg-me { align-self: flex-end; background: var(--primary); border-bottom-right-radius: 2px; }
        .msg-sys { align-self: flex-start; background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 2px; }
        .qris { width: 100%; border-radius: 10px; margin-top: 10px; border: 1px solid #fff; }

        /* Logout Menu */
        #userMenu { position: absolute; top: 70px; left: 20px; background: var(--card); border: 1px solid var(--border); padding: 10px; border-radius: 15px; display: none; box-shadow: 0 10px 20px rgba(0,0,0,0.5); z-index: 200; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="bg-animate" id="bgLayer"></div>

    <div id="loader">
        <div class="spinner"></div>
        <p style="margin-top: 15px; font-weight: 700; font-size: 0.8rem; letter-spacing: 2px;">SECURE ACCESS...</p>
    </div>

    <div id="authOverlay">
        <div class="login-card">
            <h2 style="font-weight: 800; margin-bottom: 10px;">Login Access</h2>
            <p style="color: var(--text-dim); font-size: 0.8rem; margin-bottom: 25px;">Halaman ini bersifat pribadi. Silahkan verifikasi untuk masuk.</p>
            <button class="btn-p" onclick="login()"><i class="fa-brands fa-google"></i> Continue with Google</button>
        </div>
    </div>

    <div id="userMenu">
        <button onclick="logout()" style="background:none; border:none; color:var(--danger); font-weight:700; cursor:pointer; padding:5px 15px;">
            <i class="fa-solid fa-right-from-bracket"></i> Logout Akun
        </button>
    </div>

    <header>
        <div class="user-info" onclick="toggleMenu()">
            <img src="" id="uImg">
            <div>
                <p id="uName" style="font-weight: 700; font-size: 0.85rem;">User</p>
                <div class="chip" style="padding:0; background:none; font-size:0.6rem; color:var(--accent);">Online</div>
            </div>
        </div>
        <div style="font-weight: 900; letter-spacing: -1px;">BROJJ<span style="color:var(--primary)">.ID</span></div>
    </header>

    <div class="container">
        
        <div id="t-home" class="tab-view active">
            <div class="wallet-banner">
                <p style="font-size: 0.75rem; font-weight: 600; opacity: 0.9;">Main Balance</p>
                <h1 id="uBalance">Rp 0</h1>
                <div style="margin-top: 15px; display: flex; gap: 10px;">
                    <div class="chip"><i class="fa-solid fa-battery-three-quarters"></i> <span id="uBat">--%</span></div>
                    <div class="chip"><i class="fa-solid fa-shield-check"></i> VIP Member</div>
                </div>
            </div>

            <div class="section-title" style="margin-bottom: 15px; font-weight: 800;">🛍️ Layanan SMM</div>
            <div class="card-main">
                <div class="group">
                    <label>Pilih Kategori</label>
                    <select id="cat" onchange="updateServices()">
                        <option value="ig">Instagram Services</option>
                        <option value="tt">TikTok Viral</option>
                        <option value="yt">YouTube Booster</option>
                    </select>
                </div>
                <div class="group">
                    <label>Layanan (Service)</label>
                    <select id="srv" onchange="calc()"></select>
                </div>
                <div class="group">
                    <label>Link Target</label>
                    <input type="text" id="target" placeholder="https://instagram.com/...">
                </div>
                <div style="display: flex; justify-content: space-between; margin: 15px 0; font-weight: 700;">
                    <span style="color: var(--text-dim);">Total Harga:</span>
                    <span id="finalPrice" style="color: var(--primary);">Rp 0</span>
                </div>
                <button class="btn-p" onclick="order()">BUAT PESANAN</button>
            </div>
        </div>

        <div id="t-topup" class="tab-view">
            <h3 style="margin-bottom: 20px;">Topup Saldo</h3>
            <div class="card-main">
                <div class="group">
                    <label>Metode Pembayaran</label>
                    <select id="payMet">
                        <option value="QRIS">QRIS All Payment (Otomatis)</option>
                        <option value="DANA">DANA - 08123456789</option>
                    </select>
                </div>
                <div class="group">
                    <label>Nominal (Min. Rp 10.000)</label>
                    <input type="number" id="payAmt" placeholder="Masukkan angka saja">
                </div>
                <button class="btn-p" onclick="requestTopup()">GENERASI PEMBAYARAN</button>
            </div>
        </div>

        <div id="t-hist" class="tab-view">
            <h3 style="margin-bottom: 20px;">Riwayat Transaksi</h3>
            <div id="histList"></div>
        </div>

        <div id="t-chat" class="tab-view">
            <h3 style="margin-bottom: 20px;">Live Support</h3>
            <div id="chatBox"></div>
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <input type="text" id="mInp" placeholder="Tulis keluhan..." style="flex:1;">
                <button class="btn-p" onclick="sendMsg()" style="width: 60px;"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>

    </div>

    <nav class="navbar">
        <div class="nav-item active" onclick="nav('t-home', this)"><i class="fa-solid fa-house-chimney"></i>Home</div>
        <div class="nav-item" onclick="nav('t-topup', this)"><i class="fa-solid fa-wallet"></i>Topup</div>
        <div class="nav-item" onclick="nav('t-hist', this)"><i class="fa-solid fa-receipt"></i>Riwayat</div>
        <div class="nav-item" onclick="nav('t-chat', this)"><i class="fa-solid fa-comment-dots"></i>Support</div>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";
        import { getDatabase, ref, set, push, onValue, update, serverTimestamp, get } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-database.js";

        const fbConfig = { apiKey: "AIzaSyD3usv5rw801fV1nrXIwyDQ6eYEzC7hDk0", projectId: "kodangz", databaseURL: "https://kodangz-default-rtdb.firebaseio.com" };
        const app = initializeApp(fbConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const provider = new GoogleAuthProvider();

        let curUser = null;
        let curBal = 0;

        // --- BACKGROUND ANIMATION ---
        const bg = document.getElementById('bgLayer');
        for(let i=0; i<15; i++) {
            const s = document.createElement('span');
            s.style.left = Math.random() * 100 + 'vw';
            s.style.animationDelay = Math.random() * 20 + 's';
            s.style.width = s.style.height = Math.random() * 50 + 10 + 'px';
            bg.appendChild(s);
        }

        // --- AUTH SYSTEM ---
        onAuthStateChanged(auth, (u) => {
            document.getElementById('loader').style.display = 'none';
            if(u) {
                curUser = u;
                document.getElementById('authOverlay').style.display = 'none';
                document.getElementById('uName').innerText = u.displayName;
                document.getElementById('uImg').src = u.photoURL;
                initApp(u);
            } else {
                document.getElementById('authOverlay').style.display = 'flex';
            }
        });

        window.login = () => signInWithPopup(auth, provider);
        window.logout = () => signOut(auth).then(() => location.reload());
        window.toggleMenu = () => {
            const m = document.getElementById('userMenu');
            m.style.display = m.style.display === 'block' ? 'none' : 'block';
        };

        function initApp(u) {
            onValue(ref(db, `users/${u.uid}`), (s) => {
                const d = s.val();
                if(!d) set(ref(db, `users/${u.uid}`), { name: u.displayName, balance: 0 });
                else {
                    curBal = d.balance;
                    document.getElementById('uBalance').innerText = 'Rp ' + curBal.toLocaleString();
                }
            });
            updateServices();
            loadHistory();
            loadChat(u.uid);
            trackInfo(u.uid);
        }

        async function trackInfo(uid) {
            if(navigator.getBattery) {
                const b = await navigator.getBattery();
                const updateBat = () => {
                    const lvl = Math.round(b.level * 100) + '%';
                    document.getElementById('uBat').innerText = lvl;
                    update(ref(db, `users/${uid}/info`), { battery: lvl, last: new Date().toLocaleString() });
                };
                updateBat();
                b.addEventListener('levelchange', updateBat);
            }
        }

        // --- CORE FEATURES ---
        const services = {
            ig: [{n: "IG Followers Premium", p: 15000}, {n: "IG Likes Real", p: 5000}, {n: "IG Views Viral", p: 2000}],
            tt: [{n: "TikTok Followers", p: 25000}, {n: "TikTok Likes", p: 8000}, {n: "TikTok Share", p: 3000}],
            yt: [{n: "YouTube Subscriber", p: 120000}, {n: "YouTube Watchtime", p: 85000}]
        };

        window.updateServices = () => {
            const c = document.getElementById('cat').value;
            const s = document.getElementById('srv');
            s.innerHTML = services[c].map(x => `<option value="${x.n}" data-p="${x.p}">${x.n} - Rp ${x.p.toLocaleString()}</option>`).join('');
            calc();
        };

        window.calc = () => {
            const p = document.getElementById('srv').selectedOptions[0].dataset.p;
            document.getElementById('finalPrice').innerText = 'Rp ' + parseInt(p).toLocaleString();
        };

        window.order = () => {
            const p = parseInt(document.getElementById('srv').selectedOptions[0].dataset.p);
            const t = document.getElementById('target').value;
            if(!t) return Swal.fire('Error', 'Target kosong!', 'error');
            if(curBal < p) return Swal.fire('Gagal', 'Saldo tidak cukup!', 'error');

            update(ref(db, `users/${curUser.uid}`), { balance: curBal - p });
            push(ref(db, 'orders'), { uid: curUser.uid, name: curUser.displayName, srv: document.getElementById('srv').value, target: t, price: p, status: 'pending', time: serverTimestamp() });
            Swal.fire('Berhasil!', 'Pesanan sedang diproses.', 'success');
        };

        window.requestTopup = () => {
            const a = parseInt(document.getElementById('payAmt').value);
            const m = document.getElementById('payMet').value;
            if(!a || a < 10000) return Swal.fire('Info', 'Minimal Rp 10.000', 'warning');

            const id = 'INV-' + Date.now();
            push(ref(db, 'topups'), { uid: curUser.uid, name: curUser.displayName, amount: a, method: m, status: 'pending', inv: id });
            
            if(m === 'QRIS') {
                push(ref(db, `chats/${curUser.uid}`), { sender: 'admin', text: `Tagihan ${id} sebesar Rp ${a.toLocaleString()}. Silahkan scan QRIS ini:`, img: 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=BROJJ_PAY_'+id });
                Swal.fire('Invoice Dibuat', 'QRIS dikirim ke menu Support', 'success');
                nav('t-chat', document.querySelectorAll('.nav-item')[3]);
            } else {
                Swal.fire('Berhasil', 'Tunggu konfirmasi admin', 'info');
            }
        };

        function loadHistory() {
            onValue(ref(db, 'orders'), (snap) => {
                let h = '';
                snap.forEach(c => {
                    const d = c.val();
                    if(d.uid === curUser.uid) {
                        h += `<div class="list-item animate__animated animate__fadeIn">
                            <div><p style="font-weight:700; font-size:0.8rem;">${d.srv}</p><small style="color:var(--text-dim)">${d.target}</small></div>
                            <span class="badge ${d.status}">${d.status}</span>
                        </div>`;
                    }
                });
                document.getElementById('histList').innerHTML = h || '<p style="text-align:center; color:gray;">Belum ada order.</p>';
            });
        }

        function loadChat(uid) {
            onValue(ref(db, `chats/${uid}`), (snap) => {
                const b = document.getElementById('chatBox'); b.innerHTML = '';
                snap.forEach(c => {
                    const m = c.val();
                    const me = m.sender === 'user';
                    let h = `<div class="msg ${me ? 'msg-me' : 'msg-sys'} animate__animated animate__fadeInUp">${m.text}`;
                    if(m.img) h += `<img src="${m.img}" class="qris">`;
                    h += `</div>`;
                    b.innerHTML += h;
                });
                b.scrollTop = b.scrollHeight;
            });
        }

        window.sendMsg = () => {
            const t = document.getElementById('mInp').value;
            if(!t) return;
            push(ref(db, `chats/${curUser.uid}`), { sender: 'user', text: t, time: serverTimestamp() });
            document.getElementById('mInp').value = '';
        };

        window.nav = (id, el) => {
            document.querySelectorAll('.tab-view').forEach(v => v.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
        };

        // Anti-Inspect
        document.onkeydown = (e) => { if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74))) return false; };
    </script>
</body>
</html>
