<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BroJJ Panel - SMM & Chat</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap');
        
        :root { 
            --bg: #09090b; 
            --card: #18181b; 
            --primary: #4f46e5; 
            --text: #fafafa; 
            --muted: #a1a1aa; 
            --success: #10b981; 
            --border: rgba(255, 255, 255, 0.1); 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: var(--text); overflow-x: hidden; }

        /* Fullscreen Overlay untuk Loading & Login */
        .overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: var(--bg); z-index: 10000; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
        }

        #loginScreen { display: none; background: radial-gradient(circle at top, #1e1b4b 0%, var(--bg) 70%); }
        
        .login-box { 
            background: var(--card); padding: 40px 30px; border-radius: 24px; 
            border: 1px solid var(--primary); width: 90%; max-width: 380px; 
            text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .btn-google { 
            background: white; color: black; padding: 15px; border-radius: 12px; 
            width: 100%; font-weight: 700; border: none; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; gap: 10px; 
            margin-top: 25px; transition: 0.3s;
        }

        .btn-google:active { transform: scale(0.95); }

        /* Loader Animation */
        .loader { 
            border: 4px solid rgba(255,255,255,0.1); border-left-color: var(--primary); 
            border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; 
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Main App UI */
        #mainApp { display: none; max-width: 500px; margin: 0 auto; padding: 20px; padding-bottom: 100px; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .balance-card { 
            background: linear-gradient(135deg, var(--primary), #3730a3); 
            padding: 20px; border-radius: 20px; margin-bottom: 25px;
        }

        .section { display: none; animation: fadeIn 0.4s ease; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: var(--card); padding: 20px; border-radius: 20px; margin-bottom: 15px; border: 1px solid var(--border); }
        
        .smm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .smm-item { 
            background: rgba(255,255,255,0.03); padding: 15px; border-radius: 15px; 
            text-align: center; border: 1px solid var(--border); cursor: pointer;
        }
        .smm-item i { font-size: 1.5rem; margin-bottom: 10px; display: block; }

        .btn-buy { 
            width: 100%; background: var(--primary); color: white; border: none; 
            padding: 12px; border-radius: 10px; font-weight: 600; cursor: pointer; margin-top: 10px;
        }

        /* Bottom Nav */
        .bottom-nav { 
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); 
            width: 90%; max-width: 400px; background: rgba(24, 24, 27, 0.8); 
            backdrop-filter: blur(20px); display: flex; justify-content: space-around; 
            padding: 15px; border-radius: 25px; border: 1px solid var(--border); z-index: 1000;
        }
        .nav-item { color: var(--muted); text-align: center; cursor: pointer; font-size: 0.75rem; }
        .nav-item.active { color: var(--primary); }
        .nav-item i { display: block; font-size: 1.2rem; margin-bottom: 4px; }

        input, select { 
            width: 100%; padding: 12px; background: #000; border: 1px solid var(--border); 
            border-radius: 10px; color: white; margin-top: 10px; outline: none;
        }
    </style>
</head>
<body>

    <div id="loadingOverlay" class="overlay">
        <div class="loader"></div>
        <p style="margin-top: 15px; color: var(--muted);">Menyiapkan Dashboard...</p>
    </div>

    <div id="loginScreen" class="overlay">
        <div class="login-box">
            <i class="fa-solid fa-bolt" style="font-size: 3rem; color: var(--primary);"></i>
            <h1 style="margin-top: 10px; font-size: 1.6rem;">BroJJ Panel</h1>
            <p style="color: var(--muted); font-size: 0.85rem;">Solusi SMM & Sosmed Tercepat</p>
            
            <button class="btn-google" id="btnLogin">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" width="20">
                Masuk dengan Google
            </button>
        </div>
    </div>

    <div id="mainApp">
        <header>
            <div>
                <h2 style="font-size: 1.2rem;" id="hiName">Halo, BroJJ</h2>
                <span style="font-size: 0.7rem; color: var(--muted);">Member Premium</span>
            </div>
            <div style="text-align: right;">
                <i class="fa-solid fa-bell" style="font-size: 1.2rem;"></i>
            </div>
        </header>

        <div class="balance-card">
            <p style="font-size: 0.8rem; opacity: 0.8;">Saldo Anda</p>
            <h1 id="userBalance" style="font-size: 1.8rem; font-weight: 800;">Rp 0</h1>
        </div>

        <div id="home" class="section active">
            <h3 style="margin-bottom: 15px; font-size: 1rem;"><i class="fa-solid fa-fire" style="color:#f59e0b"></i> Layanan Populer</h3>
            <div class="smm-grid">
                <div class="smm-item" onclick="order('Instagram Followers', 15000)">
                    <i class="fa-brands fa-instagram" style="color: #e1306c;"></i>
                    <span style="font-size: 0.8rem;">IG Followers</span>
                    <p style="font-size: 0.7rem; color: var(--success);">Rp 15k / 1k</p>
                </div>
                <div class="smm-item" onclick="order('TikTok Views', 1500)">
                    <i class="fa-brands fa-tiktok"></i>
                    <span style="font-size: 0.8rem;">TikTok Views</span>
                    <p style="font-size: 0.7rem; color: var(--success);">Rp 1.5k / 1k</p>
                </div>
                <div class="smm-item" onclick="order('IG Likes', 5000)">
                    <i class="fa-brands fa-instagram" style="color: #e1306c;"></i>
                    <span style="font-size: 0.8rem;">IG Likes</span>
                    <p style="font-size: 0.7rem; color: var(--success);">Rp 5k / 1k</p>
                </div>
                <div class="smm-item" onclick="order('Youtube Views', 35000)">
                    <i class="fa-brands fa-youtube" style="color: #ff0000;"></i>
                    <span style="font-size: 0.8rem;">YT Views</span>
                    <p style="font-size: 0.7rem; color: var(--success);">Rp 35k / 1k</p>
                </div>
            </div>
        </div>

        <div id="account" class="section">
            <div class="card" style="text-align: center;">
                <img id="userImg" src="" style="width: 80px; border-radius: 50%; border: 3px solid var(--primary); margin-bottom: 15px; display: none;">
                <h2 id="userName">User</h2>
                <p id="userEmail" style="font-size: 0.8rem; color: var(--muted);"></p>
                <button class="btn-buy" style="background: #ef4444; margin-top: 30px;" onclick="logOut()">Keluar Akun</button>
            </div>
        </div>

        <nav class="bottom-nav">
            <div class="nav-item active" onclick="nav('home', this)"><i class="fa-solid fa-house"></i>Home</div>
            <div class="nav-item" onclick="nav('account', this)"><i class="fa-solid fa-user"></i>Akun</div>
        </nav>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, get, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyD3usv5rw801fV1nrXIwyDQ6eYEzC7hDk0", 
            authDomain: "kodangz.firebaseapp.com", 
            projectId: "kodangz", 
            databaseURL: "https://kodangz-default-rtdb.firebaseio.com" 
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const provider = new GoogleAuthProvider();

        const load = document.getElementById('loadingOverlay');
        const login = document.getElementById('loginScreen');
        const appUI = document.getElementById('mainApp');

        // --- 1. LOGIKA LOGIN (ANTI LOOPING) ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // User terdeteksi, langsung isi data & tampilkan dashboard
                document.getElementById('hiName').innerText = "Halo, " + user.displayName.split(' ')[0];
                document.getElementById('userName').innerText = user.displayName;
                document.getElementById('userEmail').innerText = user.email;
                if(user.photoURL) {
                    const img = document.getElementById('userImg');
                    img.src = user.photoURL; img.style.display = 'inline-block';
                }

                // Cek data di Database
                const userRef = ref(db, 'users/' + user.uid);
                const snap = await get(userRef);
                if (!snap.exists()) {
                    await set(userRef, { name: user.displayName, balance: 0 });
                }

                // Sinkronisasi Saldo Real-time
                onValue(ref(db, 'users/' + user.uid + '/balance'), (s) => {
                    document.getElementById('userBalance').innerText = 'Rp ' + (s.val() || 0).toLocaleString();
                });

                // Hapus loading, tampilkan dashboard
                load.style.display = 'none';
                login.style.display = 'none';
                appUI.style.display = 'block';
            } else {
                // Tidak ada user, tampilkan layar login
                load.style.display = 'none';
                login.style.display = 'flex';
                appUI.style.display = 'none';
            }
        });

        // --- 2. FUNGSI TOMBOL LOGIN ---
        document.getElementById('btnLogin').addEventListener('click', () => {
            signInWithPopup(auth, provider).catch(err => {
                Swal.fire('Login Gagal', err.message, 'error');
            });
        });

        // --- 3. FUNGSI LOGOUT ---
        window.logOut = () => {
            signOut(auth).then(() => window.location.reload());
        };

        // --- 4. NAVIGASI ---
        window.nav = (id, el) => {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
        };

        // --- 5. LOGIKA ORDER SMM ---
        window.order = (service, price) => {
            Swal.fire({
                title: 'Order ' + service,
                html: `<input type="text" id="target" placeholder="Username/Link">
                       <input type="number" id="qty" placeholder="Jumlah (Minimal 100)">`,
                background: '#18181b', color: '#fff',
                confirmButtonText: 'Pesan Sekarang',
                preConfirm: () => {
                    const target = document.getElementById('target').value;
                    const qty = document.getElementById('qty').value;
                    if (!target || qty < 100) return Swal.showValidationMessage('Target/Jumlah tidak valid');
                    return { target, qty, total: (qty/1000) * price };
                }
            }).then((res) => {
                if(res.isConfirmed) {
                    Swal.fire('Pesanan Berhasil', 'Total: Rp ' + res.value.total.toLocaleString() + '<br>Admin akan memproses segera.', 'success');
                }
            });
        };
    </script>
</body>
</html>
