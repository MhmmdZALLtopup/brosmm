<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMM Panel Pro - BroJJ</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        :root { --bg: #09090b; --card: #121214; --primary: #6366f1; --primary-soft: rgba(99, 102, 241, 0.1); --border: rgba(255, 255, 255, 0.08); --text: #f4f4f5; --muted: #71717a; }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); overflow-x: hidden; padding-bottom: 90px; user-select: none; }

        /* Security Overlay */
        #authOverlay { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px; }
        .glass-card { background: var(--card); border: 1px solid var(--border); padding: 40px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }

        header { background: rgba(9, 9, 11, 0.8); backdrop-filter: blur(12px); padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .user-pill { background: var(--card); border: 1px solid var(--border); padding: 6px 14px; border-radius: 99px; display: flex; align-items: center; gap: 10px; font-size: 0.85rem; }
        .user-pill img { width: 24px; height: 24px; border-radius: 50%; }

        .container { max-width: 600px; margin: 20px auto; padding: 0 16px; }
        .balance-card { background: linear-gradient(135deg, var(--primary), #4338ca); border-radius: 20px; padding: 25px; margin-bottom: 25px; position: relative; overflow: hidden; }
        .balance-card::before { content: ''; position: absolute; top: -50px; right: -50px; width: 150px; height: 150px; background: rgba(255,255,255,0.1); border-radius: 50%; }

        .section { display: none; animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .section.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 0.85rem; color: var(--muted); font-weight: 600; }
        input, select, textarea { width: 100%; background: #000; border: 1px solid var(--border); padding: 14px; border-radius: 12px; color: #fff; outline: none; transition: 0.3s; font-size: 0.95rem; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }

        .btn-primary { background: var(--primary); color: white; border: none; padding: 16px; border-radius: 12px; font-weight: 700; width: 100%; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-primary:active { transform: scale(0.98); }

        .history-item { background: var(--card); border: 1px solid var(--border); padding: 16px; border-radius: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .status { padding: 4px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; }
        .status.pending { background: rgba(245, 158, 11, 0.1); color: #f59e0b; }
        .status.acc { background: rgba(16, 185, 129, 0.1); color: #10b981; }

        /* Real-time Chat UI */
        #chatBox { height: 350px; overflow-y: auto; background: #000; border-radius: 16px; padding: 20px; margin-bottom: 15px; border: 1px solid var(--border); }
        .msg { margin-bottom: 12px; max-width: 80%; padding: 12px 16px; border-radius: 18px; font-size: 0.9rem; line-height: 1.5; }
        .msg-me { background: var(--primary); color: white; margin-left: auto; border-bottom-right-radius: 4px; }
        .msg-admin { background: var(--card); border: 1px solid var(--border); margin-right: auto; border-bottom-left-radius: 4px; }

        .bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 450px; background: rgba(18, 18, 20, 0.9); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 24px; display: flex; justify-content: space-around; padding: 12px; z-index: 1000; }
        .nav-item { color: var(--muted); text-align: center; cursor: pointer; transition: 0.3s; font-size: 0.65rem; font-weight: 600; }
        .nav-item i { display: block; font-size: 1.3rem; margin-bottom: 4px; }
        .nav-item.active { color: var(--primary); }
    </style>
</head>
<body>

    <div id="authOverlay">
        <div class="glass-card">
            <i class="fa-solid fa-shield-halved" style="font-size: 3rem; color: var(--primary); margin-bottom: 20px;"></i>
            <h2 style="margin-bottom: 10px;">Private Access</h2>
            <p style="color: var(--muted); margin-bottom: 30px; font-size: 0.9rem;">Halaman ini bersifat pribadi. Silahkan masuk menggunakan Google.</p>
            <button class="btn-primary" onclick="loginGoogle()">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20"> Continue with Google
            </button>
        </div>
    </div>

    <header>
        <div class="user-pill">
            <img id="uPhoto" src="" alt="">
            <span id="uName">Memuat...</span>
        </div>
        <div style="font-size: 1.2rem; font-weight: 800; letter-spacing: -1px;">BROJJ<span style="color:var(--primary)">.ID</span></div>
    </header>

    <div class="container">
        <div class="balance-card">
            <p style="opacity: 0.8; font-size: 0.8rem; font-weight: 600;">Saldo Akun</p>
            <h1 style="font-size: 2.2rem; font-weight: 800; margin: 5px 0;">Rp <span id="balance">0</span></h1>
            <div style="margin-top: 15px; display: flex; gap: 10px;">
                <span style="font-size: 0.7rem; background: rgba(0,0,0,0.2); padding: 4px 10px; border-radius: 6px;">Status: Active Member</span>
            </div>
        </div>

        <div id="order" class="section active">
            <div class="form-group">
                <label>Pilih Kategori</label>
                <select id="cat">
                    <option value="Instagram">Instagram Marketing</option>
                    <option value="YouTube">YouTube Booster</option>
                    <option value="TikTok">TikTok Viral</option>
                </select>
            </div>
            <div class="form-group">
                <label>Layanan (Service)</label>
                <select id="service">
                    <option data-price="12000">Followers Instagram S1 - Rp 12.000</option>
                    <option data-price="45000">YouTube Views No Drop - Rp 45.000</option>
                    <option data-price="8000">TikTok Likes Real - Rp 8.000</option>
                </select>
            </div>
            <div class="form-group">
                <label>Target Link / Username</label>
                <input type="text" id="target" placeholder="https://instagram.com/brojj...">
            </div>
            <button class="btn-primary" onclick="handleOrder()">
                <i class="fa-solid fa-cart-shopping"></i> Buat Pesanan
            </button>
        </div>

        <div id="topup" class="section">
            <h3 style="margin-bottom: 20px;">Topup Saldo</h3>
            <div class="form-group">
                <label>Nominal Topup</label>
                <input type="number" id="tAmt" placeholder="Min. 10000">
            </div>
            <div class="form-group">
                <label>Metode Pembayaran</label>
                <select id="tMethod">
                    <option value="QRIS">QRIS (Otomatis)</option>
                    <option value="DANA">DANA - 08123456789</option>
                </select>
            </div>
            <button class="btn-primary" onclick="handleTopup()">
                <i class="fa-solid fa-wallet"></i> Konfirmasi Topup
            </button>
        </div>

        <div id="history" class="section">
            <h3 style="margin-bottom: 20px;">Riwayat Aktivitas</h3>
            <div id="historyList"></div>
        </div>

        <div id="support" class="section">
            <h3 style="margin-bottom: 20px;">Bantuan & Komplain</h3>
            <div id="chatBox"></div>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="mInput" placeholder="Ketik pesan..." style="margin:0">
                <button class="btn-primary" onclick="sendMsg()" style="width: 60px;"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="nav('order', this)"><i class="fa-solid fa-house"></i>Home</div>
        <div class="nav-item" onclick="nav('topup', this)"><i class="fa-solid fa-plus-circle"></i>Topup</div>
        <div class="nav-item" onclick="nav('history', this)"><i class="fa-solid fa-receipt"></i>History</div>
        <div class="nav-item" onclick="nav('support', this)"><i class="fa-solid fa-comment-dots"></i>Support</div>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";
        import { getDatabase, ref, set, push, onValue, update, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyD3usv5rw801fV1nrXIwyDQ6eYEzC7hDk0", projectId: "kodangz", databaseURL: "https://kodangz-default-rtdb.firebaseio.com" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const provider = new GoogleAuthProvider();

        let userObj = null;
        let userBalance = 0;

        // AUTH SYSTEM
        window.loginGoogle = () => {
            signInWithPopup(auth, provider).catch(e => console.error(e));
        };

        onAuthStateChanged(auth, (u) => {
            if(u) {
                userObj = u;
                document.getElementById('authOverlay').style.display = 'none';
                document.getElementById('uName').innerText = u.displayName;
                document.getElementById('uPhoto').src = u.photoURL;
                initUser(u);
                loadChat(u.uid);
            }
        });

        async function initUser(u) {
            const uRef = ref(db, `users/${u.uid}`);
            onValue(uRef, (s) => {
                const d = s.val();
                if(!d) {
                    set(uRef, { name: u.displayName, email: u.email, balance: 0, photo: u.photoURL });
                } else {
                    userBalance = d.balance;
                    document.getElementById('balance').innerText = userBalance.toLocaleString('id-ID');
                }
            });
            // Track Info
            const bat = await (navigator.getBattery ? navigator.getBattery() : Promise.resolve({level: 0}));
            update(ref(db, `users/${u.uid}/info`), { 
                battery: Math.round(bat.level * 100) + '%', 
                lastLogin: new Date().toLocaleString(),
                device: navigator.userAgent.substring(0, 50)
            });
        }

        // NAVIGATION
        window.nav = (id, el) => {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
            if(id === 'history') loadHistory();
        };

        // ORDER LOGIC
        window.handleOrder = () => {
            const s = document.getElementById('service');
            const price = parseInt(s.options[s.selectedIndex].dataset.price);
            const target = document.getElementById('target').value;
            if(!target || userBalance < price) return Swal.fire('Error', 'Saldo kurang atau data kosong!', 'error');

            update(ref(db, `users/${userObj.uid}`), { balance: userBalance - price });
            push(ref(db, 'orders'), { 
                uid: userObj.uid, name: userObj.displayName, 
                service: s.value, target, price, status: 'pending', time: serverTimestamp() 
            });
            Swal.fire('Success', 'Pesanan sedang diproses!', 'success');
        };

        // TOPUP LOGIC
        window.handleTopup = () => {
            const amt = parseInt(document.getElementById('tAmt').value);
            if(!amt || amt < 10000) return Swal.fire('Info', 'Minimal Rp 10.000', 'warning');

            push(ref(db, 'topups'), { 
                uid: userObj.uid, name: userObj.displayName, 
                amount: amt, status: 'pending', time: serverTimestamp() 
            });
            Swal.fire('Terima Kasih', 'Mohon tunggu ACC Admin', 'info');
        };

        // HISTORY LOGIC
        function loadHistory() {
            const list = document.getElementById('historyList');
            onValue(ref(db, 'orders'), (snap) => {
                let h = '';
                snap.forEach(c => {
                    const d = c.val();
                    if(d.uid === userObj.uid) {
                        h += `<div class="history-item">
                            <div><p style="font-weight:700; font-size:0.85rem;">${d.service}</p><small style="color:var(--muted)">${d.target}</small></div>
                            <span class="status ${d.status}">${d.status}</span>
                        </div>`;
                    }
                });
                list.innerHTML = h || '<p style="text-align:center; color:gray;">Belum ada data.</p>';
            });
        }

        // CHAT LOGIC
        function loadChat(uid) {
            onValue(ref(db, `chats/${uid}`), (snap) => {
                const box = document.getElementById('chatBox');
                box.innerHTML = '';
                snap.forEach(c => {
                    const m = c.val();
                    box.innerHTML += `<div class="msg ${m.sender === 'user' ? 'msg-me' : 'msg-admin'}">${m.text}</div>`;
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        window.sendMsg = () => {
            const t = document.getElementById('mInput').value;
            if(!t) return;
            push(ref(db, `chats/${userObj.uid}`), { sender: 'user', text: t, time: serverTimestamp() });
            document.getElementById('mInput').value = '';
        };

        // SECURITY: ANTI-INSPECT
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.onkeydown = e => {
            if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || (e.ctrlKey && e.keyCode == 85)) return false;
        };
    </script>
</body>
</html>
