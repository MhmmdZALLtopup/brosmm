<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BroJJ Panel - Ultimate SMM</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap');
        :root { --bg: #09090b; --card: #18181b; --primary: #4f46e5; --text: #fafafa; --muted: #a1a1aa; --success: #10b981; --border: rgba(255, 255, 255, 0.08); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: var(--text); overflow-x: hidden; }

        /* Overlays */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 10000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        #loginScreen, #mainApp, #supportModal { display: none; }
        .loader { border: 4px solid rgba(255,255,255,0.1); border-left-color: var(--primary); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Main App */
        .container { max-width: 500px; margin: 0 auto; padding: 20px; padding-bottom: 110px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .balance-card { background: linear-gradient(135deg, #1e1b4b, #4f46e5); padding: 20px; border-radius: 20px; margin-bottom: 20px; border: 1px solid var(--border); }
        
        .section { display: none; animation: fadeIn 0.4s ease; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: var(--card); padding: 18px; border-radius: 20px; margin-bottom: 15px; border: 1px solid var(--border); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn-item { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 15px; border: 1px solid var(--border); text-align: center; cursor: pointer; }
        
        /* Chat UI */
        .chat-container { height: 50vh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 15px; }
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 15px; font-size: 0.85rem; }
        .msg-me { align-self: flex-end; background: var(--primary); }
        .msg-them { align-self: flex-start; background: var(--border); }
        .msg-name { font-size: 0.65rem; color: var(--muted); display: block; margin-bottom: 4px; }

        /* Bottom Nav */
        .nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 450px; background: rgba(24, 24, 27, 0.9); backdrop-filter: blur(15px); display: flex; justify-content: space-around; padding: 15px; border-radius: 25px; border: 1px solid var(--border); z-index: 999; }
        .nav-i { color: var(--muted); text-align: center; cursor: pointer; font-size: 0.7rem; }
        .nav-i.active { color: var(--primary); }
        .nav-i i { display: block; font-size: 1.3rem; margin-bottom: 4px; }

        /* Input & Button */
        input, select { width: 100%; padding: 14px; background: #000; border: 1px solid var(--border); border-radius: 12px; color: white; margin-top: 10px; outline: none; }
        .btn-primary { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: 600; cursor: pointer; margin-top: 10px; }

        /* Support Modal */
        #supportModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 10001; flex-direction: column; }
    </style>
</head>
<body>

    <div id="loadingOverlay" class="overlay"><div class="loader"></div></div>

    <div id="loginScreen" class="overlay">
        <div style="text-align: center; width: 90%; max-width: 350px;" class="card">
            <i class="fa-solid fa-bolt" style="font-size: 3rem; color: var(--primary);"></i>
            <h2 style="margin: 15px 0 5px;">BroJJ Panel</h2>
            <p style="color: var(--muted); font-size: 0.8rem;">Login aman via Google</p>
            <button class="btn-primary" id="loginBtn" style="background: white; color: black; display: flex; align-items: center; justify-content: center; gap: 10px;">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" width="18"> Masuk Google
            </button>
        </div>
    </div>

    <div id="supportModal">
        <div style="padding: 20px; background: var(--card); display: flex; align-items: center; gap: 15px; border-bottom: 1px solid var(--border);">
            <i class="fa-solid fa-arrow-left" onclick="closeSupport()" style="cursor:pointer"></i>
            <h3>Admin Support</h3>
        </div>
        <div id="supportBox" class="chat-container" style="flex-grow: 1; height: auto; margin: 15px;"></div>
        <div style="padding: 15px; display: flex; gap: 10px; background: var(--card);">
            <input type="text" id="supportInp" placeholder="Pesan ke admin..." style="margin:0">
            <button onclick="sendSupport()" class="btn-primary" style="margin:0; width: 60px;"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <div id="mainApp" class="container">
        <header class="header">
            <div>
                <h2 id="hiName">Halo, User</h2>
                <span style="font-size: 0.7rem; color: var(--muted);"><i class="fa-solid fa-circle" style="color: var(--success); font-size: 0.5rem;"></i> Online</span>
            </div>
            <i class="fa-solid fa-headset" onclick="openSupport()" style="font-size: 1.5rem; color: var(--primary);"></i>
        </header>

        <div class="balance-card">
            <p style="font-size: 0.8rem; opacity: 0.8;">Saldo Aktif</p>
            <h1 id="userBalance" style="font-size: 1.8rem;">Rp 0</h1>
        </div>

        <div id="home" class="section active">
            <h3 style="margin-bottom: 15px;">Layanan SMM</h3>
            <div class="grid">
                <div class="btn-item" onclick="order('IG Followers', 15000, 100)"><i class="fa-brands fa-instagram"></i><br>Followers</div>
                <div class="btn-item" onclick="order('TikTok Views', 1000, 1000)"><i class="fa-brands fa-tiktok"></i><br>Views</div>
            </div>
            
            <h3 style="margin: 25px 0 15px;">Riwayat Pesanan</h3>
            <div id="orderHistory"></div>
        </div>

        <div id="topup" class="section">
            <div class="card">
                <h3>Isi Saldo (QRIS)</h3>
                <select id="topupAmt">
                    <option value="10000">Rp 10.000</option>
                    <option value="50000">Rp 50.000</option>
                    <option value="100000">Rp 100.000</option>
                </select>
                <button class="btn-primary" onclick="processTopup()">Generate Invoice</button>
            </div>
            <h3>Riwayat Invoice</h3>
            <div id="invoiceHistory"></div>
        </div>

        <div id="chat" class="section">
            <div class="card">
                <h3>Global Chat</h3>
                <div id="globalBox" class="chat-container"></div>
                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <input type="text" id="chatInp" placeholder="Ketik pesan..." style="margin:0">
                    <button onclick="sendGlobal()" class="btn-primary" style="margin:0; width: 60px;"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </div>

        <div id="account" class="section">
            <div class="card" style="text-align: center;">
                <img id="uImg" src="" style="width: 80px; border-radius: 50%; margin-bottom: 10px; border: 2px solid var(--primary); display:none">
                <h2 id="uName">BroJJ</h2>
                <p id="uEmail" style="color:var(--muted); font-size: 0.8rem;"></p>
                <button class="btn-primary" onclick="logOut()" style="background: #ef4444; margin-top: 20px;">Keluar Akun</button>
            </div>
        </div>

        <nav class="nav">
            <div class="nav-i active" onclick="nav('home', this)"><i class="fa-solid fa-house"></i>Home</div>
            <div class="nav-i" onclick="nav('chat', this)"><i class="fa-solid fa-comments"></i>Chat</div>
            <div class="nav-i" onclick="nav('topup', this)"><i class="fa-solid fa-wallet"></i>Topup</div>
            <div class="nav-i" onclick="nav('account', this)"><i class="fa-solid fa-user"></i>Akun</div>
        </nav>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, push, onValue, get, set, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyD3usv5rw801fV1nrXIwyDQ6eYEzC7hDk0", 
            authDomain: "kodangz.firebaseapp.com", 
            projectId: "kodangz", 
            databaseURL: "https://kodangz-default-rtdb.firebaseio.com" 
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const provider = new GoogleAuthProvider();

        let user = null;

        // --- AUTH SYSTEM ---
        onAuthStateChanged(auth, async (u) => {
            document.getElementById('loadingOverlay').style.display = 'none';
            if (u) {
                user = u;
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('mainApp').style.display = 'block';
                document.getElementById('hiName').innerText = "Halo, " + u.displayName.split(' ')[0];
                document.getElementById('uName').innerText = u.displayName;
                document.getElementById('uEmail').innerText = u.email;
                if(u.photoURL) { document.getElementById('uImg').src = u.photoURL; document.getElementById('uImg').style.display = 'inline-block'; }
                
                // Sync Saldo
                onValue(ref(db, `users/${u.uid}/balance`), (s) => {
                    document.getElementById('userBalance').innerText = 'Rp ' + (s.val() || 0).toLocaleString();
                });

                loadGlobal(); loadSupport(); loadOrders(); loadInvoices();
            } else {
                document.getElementById('loginScreen').style.display = 'flex';
                document.getElementById('mainApp').style.display = 'none';
            }
        });

        document.getElementById('loginBtn').onclick = () => signInWithPopup(auth, provider);
        window.logOut = () => signOut(auth).then(() => window.location.reload());

        // --- CHAT SYSTEM ---
        const sensor = (t) => {
            const bad = ['anjing','bangsat','kontol','memek','babi','ngentot','tolol'];
            bad.forEach(w => t = t.replace(new RegExp(w, 'gi'), '***')); return t;
        };

        window.sendGlobal = () => {
            const inp = document.getElementById('chatInp');
            if(!inp.value.trim()) return;
            push(ref(db, 'global_chat'), { uid: user.uid, name: user.displayName, text: sensor(inp.value), time: serverTimestamp() });
            inp.value = '';
        };

        function loadGlobal() {
            onValue(ref(db, 'global_chat'), (s) => {
                const b = document.getElementById('globalBox'); b.innerHTML = '';
                s.forEach(c => {
                    const d = c.val(); const isMe = d.uid === user.uid;
                    b.innerHTML += `<div class="msg ${isMe ? 'msg-me' : 'msg-them'}"><span class="msg-name">${d.name}</span>${d.text}</div>`;
                });
                b.scrollTop = b.scrollHeight;
            });
        }

        // --- SUPPORT CHAT ---
        window.openSupport = () => document.getElementById('supportModal').style.display = 'flex';
        window.closeSupport = () => document.getElementById('supportModal').style.display = 'none';
        window.sendSupport = () => {
            const inp = document.getElementById('supportInp');
            if(!inp.value.trim()) return;
            push(ref(db, `support/${user.uid}/msgs`), { sender: 'user', text: inp.value, time: serverTimestamp() });
            inp.value = '';
        };

        function loadSupport() {
            onValue(ref(db, `support/${user.uid}/msgs`), (s) => {
                const b = document.getElementById('supportBox'); b.innerHTML = '';
                s.forEach(c => {
                    const d = c.val(); const isMe = d.sender === 'user';
                    b.innerHTML += `<div class="msg ${isMe ? 'msg-me' : 'msg-them'}"><span class="msg-name">${isMe?'Anda':'Admin'}</span>${d.text}</div>`;
                });
                b.scrollTop = b.scrollHeight;
            });
        }

        // --- ORDER & INVOICE ---
        window.order = (service, price, min) => {
            Swal.fire({
                title: service, html: `<input id="trg" placeholder="Target"><input id="qty" type="number" placeholder="Jumlah (min ${min})">`,
                preConfirm: () => {
                    const t = document.getElementById('trg').value; const q = document.getElementById('qty').value;
                    if(!t || q < min) return Swal.showValidationMessage('Data tidak valid');
                    return { t, q, total: (q/1000)*price };
                }
            }).then(async res => {
                if(res.isConfirmed) {
                    const bal = (await get(ref(db, `users/${user.uid}/balance`))).val() || 0;
                    if(bal < res.value.total) return Swal.fire('Gagal', 'Saldo tidak cukup', 'error');
                    push(ref(db, `orders/${user.uid}`), { service, ...res.value, status: 'pending', date: new Date().toLocaleString() });
                    Swal.fire('Berhasil', 'Pesanan sedang diproses', 'success');
                }
            });
        };

        window.processTopup = () => {
            const amt = document.getElementById('topupAmt').value;
            const invId = 'INV' + Math.floor(Math.random()*99999);
            push(ref(db, `invoices/${user.uid}`), { invId, amount: amt, status: 'unpaid', date: new Date().toLocaleString() });
            Swal.fire({
                title: 'Bayar via QRIS', text: 'Transfer Rp ' + amt + ' ke QRIS Admin',
                imageUrl: 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=ADMIN_QRIS_HERE',
                footer: 'Invoice ID: ' + invId
            });
        };

        function loadOrders() {
            onValue(ref(db, `orders/${user.uid}`), s => {
                const b = document.getElementById('orderHistory'); b.innerHTML = '';
                s.forEach(c => { const d = c.val(); b.innerHTML += `<div class="card" style="font-size:0.8rem">${d.service} - ${d.q} (${d.status})</div>`; });
            });
        }

        function loadInvoices() {
            onValue(ref(db, `invoices/${user.uid}`), s => {
                const b = document.getElementById('invoiceHistory'); b.innerHTML = '';
                s.forEach(c => { const d = c.val(); b.innerHTML += `<div class="card" style="font-size:0.8rem">${d.invId} - Rp ${d.amount} (${d.status})</div>`; });
            });
        }

        window.nav = (id, el) => {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-i').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
        };
    </script>
</body>
</html>
