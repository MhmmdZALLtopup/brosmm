<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BroJJ Panel - Fix</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');
        :root { --bg: #09090b; --primary: #4f46e5; --card: #18181b; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }
        body { background: var(--bg); color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .fullscreen-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .login-box { background: var(--card); padding: 40px 30px; border-radius: 25px; border: 1px solid var(--primary); width: 90%; max-width: 380px; box-shadow: 0 0 30px rgba(79, 70, 229, 0.2); text-align: center; }
        
        .btn-google { background: white; color: black; padding: 15px; border-radius: 15px; width: 100%; font-weight: 700; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 30px; font-size: 1rem; }
        .btn-google:active { transform: scale(0.98); }

        #mainApp { display: none; width: 100%; max-width: 500px; padding: 20px; }
        .loader { border: 4px solid rgba(255,255,255,0.1); border-left-color: var(--primary); border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loadingOverlay" class="fullscreen-overlay">
        <div class="loader"></div>
        <p id="loadingText">Menyiapkan Sistem...</p>
    </div>

    <div id="loginScreen" class="fullscreen-overlay" style="display: none;">
        <div class="login-box">
            <i class="fa-solid fa-bolt" style="font-size: 3.5rem; color: var(--primary); margin-bottom: 15px;"></i>
            <h1 style="font-size: 1.8rem;">BroJJ Panel</h1>
            <p style="color: #a1a1aa; font-size: 0.9rem;">SMM & Community Chat</p>
            
            <button class="btn-google" id="btnLog">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" width="22">
                Masuk dengan Google
            </button>
        </div>
    </div>

    <div id="mainApp">
        <div style="background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);">
            <h2 id="welcomeText">Halo, BroJJ!</h2>
            <p style="font-size: 0.8rem; color: #a1a1aa;">Selamat datang di dashboard kamu.</p>
            <hr style="margin: 20px 0; opacity: 0.1;">
            <button onclick="logoutNow()" style="background: #ef4444; color: white; border: none; padding: 12px; width: 100%; border-radius: 12px; font-weight: 600;">Log Out</button>
        </div>
    </div>

    <script type="module">
        // GUNAKAN VERSI 10.8.0 (SANGAT STABIL)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithRedirect, getRedirectResult, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Konfigurasi Project Kamu
        const firebaseConfig = { 
            apiKey: "AIzaSyD3usv5rw801fV1nrXIwyDQ6eYEzC7hDk0", 
            authDomain: "kodangz.firebaseapp.com", // Pastikan ini sama dengan ID Project
            projectId: "kodangz", 
            databaseURL: "https://kodangz-default-rtdb.firebaseio.com" 
        };

        // Inisialisasi
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' }); // Agar muncul pilihan email

        const loadingOverlay = document.getElementById('loadingOverlay');
        const loginScreen = document.getElementById('loginScreen');
        const mainApp = document.getElementById('mainApp');

        // 1. CEK HASIL REDIRECT (SETELAH PILIH EMAIL)
        getRedirectResult(auth).then((result) => {
            if (result?.user) {
                console.log("Berhasil Login:", result.user.displayName);
            }
        }).catch((error) => {
            console.error("Error Redirect:", error);
            alert("Gagal Login: " + error.message);
            loadingOverlay.style.display = 'none';
        });

        // 2. PANTAU STATUS LOGIN
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // Berhasil Login
                document.getElementById('welcomeText').innerText = "Halo, " + user.displayName + "!";
                loadingOverlay.style.display = 'none';
                loginScreen.style.display = 'none';
                mainApp.style.display = 'block';

                // Simpan ke Database
                const userRef = ref(db, 'users/' + user.uid);
                const snap = await get(userRef);
                if (!snap.exists()) {
                    await set(userRef, { name: user.displayName, email: user.email, balance: 0 });
                }
            } else {
                // Belum Login
                loadingOverlay.style.display = 'none';
                loginScreen.style.display = 'flex';
                mainApp.style.display = 'none';
            }
        });

        // 3. FUNGSI LOGIN (DITEMPEL KE TOMBOL)
        const btnLog = document.getElementById('btnLog');
        btnLog.addEventListener('click', () => {
            loadingOverlay.style.display = 'flex';
            document.getElementById('loadingText').innerText = "Menghubungkan ke Google...";
            
            // Eksekusi Login
            signInWithRedirect(auth, provider).catch(err => {
                alert("Error: " + err.message);
                loadingOverlay.style.display = 'none';
            });
        });

        // 4. FUNGSI LOGOUT (DITEMPEL KE WINDOW AGAR BISA DIPANGGIL HTML)
        window.logoutNow = () => {
            signOut(auth).then(() => {
                window.location.reload();
            });
        };

    </script>
</body>
</html>
